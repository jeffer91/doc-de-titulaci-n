name: Validar Electron UTET
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxis
        run: npm run check
      - name: Probar registro, portadas y navegación
        run: npm test
      - name: Probar impresión real del memorando PDF con Electron
        run: |
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox electron/smoke-antiplagio.cjs --one
          xvfb-run -a ./node_modules/.bin/electron --no-sandbox electron/smoke-antiplagio.cjs --many
