<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"/>
  <title>UTET · Gestor Documental</title>
  <meta name="theme-color" content="#092d5f"/>
  <link rel="icon" href="assets/utet-app-icon.ico" type="image/x-icon" sizes="any"/>
  <link rel="icon" href="assets/utet-app-icon.png" type="image/png" sizes="256x256"/>
  <link rel="apple-touch-icon" href="assets/utet-app-icon.png"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="institutional.css"/>
  <link rel="stylesheet" href="minimal.css"/>
  <link rel="stylesheet" href="records.css"/>
  <link rel="stylesheet" href="antiplagio.css"/>
  <link rel="stylesheet" href="acta-articulo.ui.css"/>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="UTET Gestor Documental">
        <div class="identity-mark"><img class="identity-logo" src="assets/utet-app-icon.png" alt="" width="40" height="40"/></div>
        <div class="brand-copy"><strong>UTET</strong><small>Gestor Documental</small></div>
      </div>
      <nav id="nav-main" aria-label="Navegación principal"></nav>
      <div class="top-actions">
        <span class="firebase-status">SQLite local · Antiplagio</span>
        <button type="button" class="btn btn-primary new-document" data-action="go-documents">＋ Nuevo documento</button>
      </div>
    </header>
    <div class="period-dock">
      <label class="period-focus" for="period-select">
        <span class="calendar-mark" aria-hidden="true">▦</span>
        <span class="period-caption">Período académico</span>
        <select id="period-select" aria-label="Seleccionar período académico"></select>
      </label>
    </div>
    <main class="main-area">
      <section id="app-content" class="content" tabindex="-1"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="institutional.js"></script>
  <script src="records.js"></script>
  <script src="records-ui.js"></script>
  <script src="antiplagio.model.js"></script>
  <script src="antiplagio.js"></script>
  <script src="acta-articulo.model.js"></script>
  <script src="acta-articulo.js"></script>
  <script src="app.js"></script>
</body>
</html>
